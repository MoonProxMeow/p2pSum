<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTalk | P2P E2EE Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="drm-overlay" class="drm-overlay hidden">
  <div class="drm-content">
    <div class="drm-icon">⚠</div>
    <div class="drm-title">Recording Detected</div>
    <div class="drm-sub">Screen capture detected. Media suspended for privacy.</div>
  </div>
</div>

<div id="lightbox" class="lightbox hidden">
  <div class="lightbox-bg"></div>
  <button class="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div id="emoji-picker" class="emoji-picker hidden"></div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">NexTalk</div>
      <div id="my-status" class="status-indicator online"></div>
    </div>
    
    <div class="nav-links">
      <button id="nav-main" class="nav-btn active"># general</button>
      <button id="nav-friends" class="nav-btn">👥 Friends</button>
      <button id="nav-settings" class="nav-btn">⚙ Settings</button>
    </div>

    <div class="peer-section">
      <div class="section-label">Connected Peers</div>
      <div id="peer-list" class="peer-list"></div>
    </div>

    <div class="sidebar-footer">
      <div id="my-avatar" class="user-avatar"></div>
      <div class="user-info">
        <div id="my-username" class="username">Anonymous</div>
        <div id="my-peer-id" class="peer-id-display">Connecting...</div>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div id="header-bar" class="header-bar">
      <div id="view-title" class="view-title"># general</div>
      <div class="header-actions">
        <button id="start-call-btn" class="header-btn" title="Start Call">📞</button>
        <button id="add-peer-btn" class="header-btn" title="Connect to Peer">＋</button>
      </div>
    </div>

    <div id="call-overlay" class="call-overlay hidden">
      <div class="call-content">
        <div id="call-status">Calling...</div>
        <div class="call-participants" id="call-participants"></div>
        <div class="call-controls">
          <button id="toggle-mic" class="call-btn">🎤</button>
          <button id="end-call" class="call-btn hangup">📞</button>
        </div>
      </div>
      <audio id="remote-audio-container" autoplay></audio>
    </div>

    <div id="main-view" class="view-pane">
      <div id="messages" class="messages"></div>
      <div class="input-bar">
        <button id="emoji-btn" class="emoji-trigger">😊</button>
        <label class="file-label-inline" title="Send file">
          <span>📎</span>
          <input type="file" id="file-input" style="display:none">
        </label>
        <div class="input-wrap">
          <input id="message" placeholder="Message #general…" autocomplete="off">
        </div>
        <button id="send" class="send-btn">↑</button>
      </div>
    </div>

    <div id="dm-view" class="view-pane hidden">
      <div id="dm-messages" class="messages"></div>
      <div class="input-bar">
        <button id="dm-emoji-btn" class="emoji-trigger">😊</button>
        <label class="file-label-inline" title="Send image">
          <span>🖼</span>
          <input type="file" id="dm-img-input" accept="image/*" style="display:none">
        </label>
        <div class="input-wrap">
          <input id="dm-input" placeholder="Send a message…" autocomplete="off">
        </div>
        <button id="dm-send" class="send-btn">↑</button>
      </div>
    </div>

    <div id="friends-view" class="view-pane hidden">
      <div class="friends-header">
        <input id="friend-key-input" placeholder="Enter Friend Key...">
        <button id="add-friend-btn" class="btn btn-primary">Add Friend</button>
      </div>
      <div class="friend-key-share">
        <span>Your Friend Key:</span>
        <code id="my-friend-key">----</code>
        <button id="copy-friend-key" class="btn btn-sm">Copy</button>
      </div>
      <div id="friends-list" class="friends-list"></div>
    </div>

  </div><div id="settings-panel" class="settings-panel hidden">
    <div class="settings-header">
      <span class="settings-title">⚙ Settings</span>
      <button id="settings-close" class="dm-close-btn">✕</button>
    </div>
    <div class="settings-body" id="settings-body">
      <div class="settings-group">
        <label>Username</label>
        <input id="settings-username" type="text">
      </div>
      <div class="settings-group">
        <label>Call Preferences</label>
        <div id="settings-toggles"></div>
      </div>
      <div class="settings-group">
        <button id="export-acc-btn" class="btn">Export Account</button>
        <button id="burn-acc-btn" class="btn btn-danger">Burn Account</button>
      </div>
    </div>
  </div>

</div><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
