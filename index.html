<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTalk</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>

<!-- PROTECTION OVERLAY -->
<div id="drm-overlay" class="drm-overlay hidden">
  <div class="drm-content">
    <div class="drm-title">PROTECTED CONTENT</div>
    <div class="drm-sub">SCREEN CAPTURE DETECTED</div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox hidden">
  <div class="lightbox-bg"></div>
  <img id="lightbox-img">
</div>

<!-- EMOJI PICKER -->
<div id="emoji-picker" class="emoji-picker hidden"></div>

<!-- DM -->
<div id="dm-panel" class="dm-panel hidden">
  <div class="dm-header">
    <span id="dm-name"></span>
    <button id="dm-close">✕</button>
  </div>
  <div id="dm-messages" class="messages"></div>
  <div class="input-bar">
    <input id="dm-input" placeholder="Message...">
    <button id="dm-send">Send</button>
  </div>
</div>

<div id="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">NexTalk</div>

  <div class="id-box">
    <div id="my-id">connecting...</div>
    <button id="copy-id">⎘</button>
  </div>

  <div class="join-row">
    <input id="peer-id-input" placeholder="Peer ID">
    <button id="connect-btn">Connect</button>
  </div>

  <div id="peers"></div>
</div>

<!-- MAIN -->
<div class="chat-area">

  <div class="toolbar">
    <button id="join-call">Join</button>
    <button id="leave-call" disabled>Leave</button>
    <button id="btn-camera" disabled>Cam</button>
    <button id="btn-mute" disabled>Mute</button>
    <button id="btn-screen" disabled>Screen</button>
  </div>

  <div id="messages" class="messages"></div>

  <div class="input-bar">
    <input id="msg-input" placeholder="Message...">
    <button id="emoji-btn">😊</button>
    <input type="file" id="img-input" accept="image/*" hidden>
    <button id="img-btn">📷</button>
    <button id="send-btn">Send</button>
  </div>

  <div id="video-grid" class="video-grid"></div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>
